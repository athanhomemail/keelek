# /etc/nginx/sites-available/keelek.kuayrai.com
# หรือสำหรับ kuayrai.com

server {
    listen 80;
    listen [::]:80;
    server_name keelek.kuayrai.com kuayrai.com www.kuayrai.com;

    # Frontend Static Build (Vite SPA)
    root /var/www/keelek/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # Gzip Compression เพื่อโหลดเร็วขึ้น
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Client-side Routing (Single Page App)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Node.js Backend (PM2 Port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket requests for Socket.io Real-time
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:3000;
    }
}
