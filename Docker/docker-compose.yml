services:
  mysql:
    image: mysql:8.0
    container_name: mysql-kuayrai
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+07:00' --init-connect='SET NAMES utf8mb4'
    environment:
      TZ: Asia/Bangkok
      MYSQL_ROOT_PASSWORD: root_password_kuayrai
      MYSQL_DATABASE: keelek
      MYSQL_USER: keelek_user
      MYSQL_PASSWORD: keelek_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_kuayrai_data:/var/lib/mysql
      - ../SQLSchema:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_kuayrai_data:
    name: mysql_kuayrai_data
